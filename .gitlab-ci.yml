stages:
  - typecheck
  - unit
  - deploy

default:
  image: node:22
  tags:
    - SERVER-docker-runner
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  interruptible: true

typecheck:
  stage: typecheck
  script:
    - npm ci
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.json"
        - ".gitlab-ci.yml"

unit:
  stage: unit
  script:
    - npm ci
    - npm run test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.css"
        - "**/*.json"
        - ".gitlab-ci.yml"

mcp:
  stage: unit
  script:
    # The MCP server imports app/utilities, so it needs the site's dependencies too
    - npm ci
    - npm ci --prefix mcp
    - npm run typecheck --prefix mcp
    - npm test --prefix mcp
    - npm run build --prefix mcp
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "mcp/**/*"
        - "app/utilities/**/*"
        - "app/types/**/*"
        - ".gitlab-ci.yml"

deploy:
  stage: deploy
  interruptible: false
  environment:
    name: production
    url: https://coolours.perpetualsummer.ltd
  before_script:
    - command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )
    - eval $(ssh-agent -s)
    - printf '\n' >> "$SSH_DEPLOY_KEY"
    - chmod 400 "$SSH_DEPLOY_KEY" && ssh-add "$SSH_DEPLOY_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $VPS_USER@$VPS_HOST "~/server/deploy.sh coolours.perpetualsummer.ltd"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
